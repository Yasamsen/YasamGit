<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YasamGit V5.2</title><style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f1117;
  color:#fff;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
  width:100%;
}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#171a23;
  border:1px solid #292e3b;
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#8f96a8;
  margin-bottom:28px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#cbd0dc;
  font-size:14px;
}

input,textarea{
  width:100%;
  border:1px solid #303644;
  background:#0f1219;
  color:#fff;
  border-radius:12px;
  padding:13px 14px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#6c7cff;
}

.login-btn{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#5865f2;
  color:#fff;
  font-weight:700;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  margin-top:14px;
  background:#3a1820;
  border:1px solid #6e2634;
  color:#ff9aaa;
  padding:11px;
  border-radius:10px;
  font-size:14px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#141720;
  border-bottom:1px solid #292e3b;
  padding:12px 16px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.user{
  color:#9ba3b5;
  font-size:13px;
}

.logout{
  border:1px solid #3a4050;
  background:#1b1f29;
  color:#fff;
  padding:9px 12px;
  border-radius:10px;
}

/* MAIN */

.main{
  max-width:1200px;
  margin:auto;
  padding:20px 16px 100px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.action{
  border:1px solid #303644;
  background:#191d27;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
}

.action.primary{
  background:#5865f2;
  border-color:#5865f2;
}

.repo-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:14px;
}

.repo{
  background:#171a23;
  border:1px solid #292e3b;
  border-radius:15px;
  padding:17px;
}

.repo-name{
  font-weight:700;
  margin-bottom:8px;
  word-break:break-word;
}

.repo-desc{
  color:#8f96a8;
  font-size:13px;
  min-height:35px;
}

.repo button{
  margin-top:14px;
  width:100%;
}

/* FILE VIEW */

.panel{
  background:#171a23;
  border:1px solid #292e3b;
  border-radius:16px;
  overflow:hidden;
}

.panel-header{
  padding:14px 16px;
  border-bottom:1px solid #292e3b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.breadcrumb{
  color:#b7bdca;
  word-break:break-all;
}

.file-list{
  width:100%;
}

.file-row{
  min-height:56px;
  padding:10px 14px;
  border-bottom:1px solid #252a35;
  display:flex;
  align-items:center;
  gap:12px;
}

.file-row:last-child{
  border-bottom:0;
}

.file-icon{
  width:30px;
  text-align:center;
}

.file-info{
  flex:1;
  min-width:0;
}

.file-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.file-type{
  color:#7f8799;
  font-size:12px;
  margin-top:3px;
}

.file-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  border:1px solid #303644;
  background:#1b1f29;
  color:#fff;
  border-radius:8px;
  padding:7px 9px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#171a23;
  border:1px solid #303644;
  border-radius:18px;
  padding:20px;
}

.modal-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:15px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* PREVIEW */

.preview{
  max-width:100%;
  max-height:65vh;
  display:block;
  margin:auto;
  border-radius:10px;
}

video.preview{
  width:100%;
}

pre.code{
  background:#0d1016;
  border:1px solid #292e3b;
  border-radius:10px;
  padding:14px;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:65vh;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  z-index:999;
  background:rgba(8,10,14,.72);
  display:flex;
  align-items:center;
  justify-content:center;
}

.loading-box{
  background:#171a23;
  border:1px solid #303644;
  padding:20px 24px;
  border-radius:15px;
  text-align:center;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #343a48;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:auto auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* MOBILE */

@media(max-width:600px){

  .login-box{
    padding:22px;
  }

  .main{
    padding:14px 10px 80px;
  }

  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .action{
    width:100%;
  }

  .repo-grid{
    grid-template-columns:1fr;
  }

  .file-row{
    align-items:flex-start;
  }

  .file-actions{
    flex-wrap:wrap;
  }

  .file-actions .small-btn{
    font-size:0;
  }

  .file-actions .small-btn::after{
    content:"...";
    font-size:14px;
  }

  .header-inner{
    flex-wrap:wrap;
  }
}
</style></head><body><div id="loading" class="loading hidden">
  <div class="loading-box">
    <div class="spinner"></div>

  </div>
</div><!-- LOGIN --><section id="loginPage" class="login-page">  <div class="login-box"><div class="logo">

  </div></section><!-- APP --><section id="appPage" class="app hidden">  <header class="header"><div class="header-inner">

  <div>
    <div class="brand">
      🟣 YasamGit V5.2
    </div>

    <div
      id="username"

    >

  <button
    id="logoutButton"

  </header>  <main class="main"><div class="toolbar">

  <button
    id="refreshRepos"

  <button

<div id="repoView">

  <div class="panel">

    <div class="panel-header">
      <strong>📁 Repository</strong>
      <span id="repoCount">0</span>
    </div>

    <div
      id="repoList"
      class="repo-grid"
      style="padding:14px"
    ></div>

  </div>

</div>

<div
  id="fileView"
  class="hidden"
>

  <div class="toolbar">

    <button
      id="backRepos"
      class="action"
    >
      ← Repository
    </button>

    <button
      id="uploadButton"
      class="action primary"
    >
      📤 Upload
    </button>

    <button
      id="folderButton"
      class="action"
    >
      📁 Folder
    </button>

    <button
      id="searchFileButton"
      class="action"
    >
      🔍 Search
    </button>

  </div>

  <div class="panel">

    <div class="panel-header">

      <div
        id="breadcrumb"
        class="breadcrumb"
      ></div>

      <select
        id="branchSelect"
        class="action"
      ></select>

</div>

  </main></section><!-- MODAL --><div
  id="modal"
  class="modal hidden"
>
  <div class="modal-box"><div

></div>

<div id="modalContent"></div>

<div class="modal-actions">

  <button
    id="modalCancel"

    Batal
  </button>

</div>

  </div>
</div><script>
"use strict";

/*
 * =====================================================
 * YasamGit V5.2 FRONTEND
 * =====================================================
 */

const API_BASE =
  "https://yasam-git-backend.vercel.app";

let currentUser = null;
let currentRepo = null;
let currentPath = "";
let currentBranch = "";
let currentItems = [];


/* =========================
   DOM
========================= */

const $ = id =>
  document.getElementById(id);

const loginPage =
  $("loginPage");

const appPage =
  $("appPage");

const loading =
  $("loading");

const loadingText =
  $("loadingText");

const loginForm =
  $("loginForm");

const loginButton =
  $("loginButton");

const loginError =
  $("loginError");

const repoView =
  $("repoView");

const fileView =
  $("fileView");

const repoList =
  $("repoList");

const repoCount =
  $("repoCount");

const username =
  $("username");

const fileList =
  $("fileList");

const breadcrumb =
  $("breadcrumb");

const branchSelect =
  $("branchSelect");

const modal =
  $("modal");

const modalTitle =
  $("modalTitle");

const modalContent =
  $("modalContent");

const modalCancel =
  $("modalCancel");

const modalSubmit =
  $("modalSubmit");


/* =========================
   LOADING
========================= */

function showLoading(text = "Memproses...") {

  loadingText.textContent =
    text;

  loading.classList.remove(
    "hidden"
  );
}

function hideLoading() {

  loading.classList.add(
    "hidden"
  );
}


/* =========================
   API
========================= */

async function api(
  path,
  options = {}
) {

  const response =
    await fetch(
      API_BASE + path,
      {
        credentials:
          "include",

        ...options,

        headers:{
          ...(options.body
            ? {
                "Content-Type":
                  "application/json"
              }
            : {}),

          ...(options.headers || {})
        }
      }
    );

  let data;

  const text =
    await response.text();

  try {
    data =
      text
        ? JSON.parse(text)
        : {};
  } catch {
    data = {
      message:text
    };
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      data.message ||
      `HTTP ${response.status}`
    );
  }

  return data;
}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    loginError.classList.add(
      "hidden"
    );

    const password =
      $("password").value;

    if (!password) {
      return;
    }

    loginButton.disabled =
      true;

    loginButton.textContent =
      "...";

    showLoading(
      "Login..."
    );

    try {

      await api(
        "/api/login",
        {
          method:"POST",

          body:
            JSON.stringify({
              password
            })
        }
      );

      $("password").value =
        "";

      await checkSession();

    } catch(error) {

      loginError.textContent =
        error.message;

      loginError.classList.remove(
        "hidden"
      );

    } finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        "🔐 Login";

      hideLoading();
    }
  }
);


/* =========================
   SESSION
========================= */

async function checkSession() {

  try {

    const session =
      await api(
        "/api/session"
      );

    if (
      session.authenticated
    ) {

      await showApp();

    } else {

      showLogin();
    }

  } catch {

    showLogin();
  }
}


function showLogin() {

  loginPage.classList.remove(
    "hidden"
  );

  appPage.classList.add(
    "hidden"
  );
}


async function showApp() {

  loginPage.classList.add(
    "hidden"
  );

  appPage.classList.remove(
    "hidden"
  );

  showLoading(
    "Mengambil akun GitHub..."
  );

  try {

    const user =
      await api(
        "/api/github/user"
      );

    currentUser =
      user;

    username.textContent =
      `👤 ${user.login}`;

    await loadRepos();

  } catch(error) {

    alert(
      "Gagal mengambil akun GitHub: " +
      error.message
    );

    await logout();

  } finally {

    hideLoading();
  }
}


/* =========================
   REPOSITORIES
========================= */

async function loadRepos() {

  showLoading(
    "Memuat repository..."
  );

  try {

    const repos =
      await api(
        "/api/github/repos"
      );

    renderRepos(
      Array.isArray(repos)
        ? repos
        : []
    );

  } catch(error) {

    repoList.innerHTML =
      `<div style="padding:20px;color:#ff8c9b">
        ${escapeHtml(
          error.message
        )}
      </div>`;

  } finally {

    hideLoading();
  }
}


function renderRepos(repos) {

  repoCount.textContent =
    repos.length;

  if (!repos.length) {

    repoList.innerHTML =
      `<div style="padding:20px;color:#8f96a8">
        Belum ada repository.
      </div>`;

    return;
  }

  repoList.innerHTML =
    repos.map(repo => {

      return `
        <div class="repo">

          <div class="repo-name">
            📁 ${escapeHtml(
              repo.name
            )}
          </div>

          <div class="repo-desc">
            ${escapeHtml(
              repo.description ||
              "Tidak ada deskripsi"
            )}
          </div>

          <button
            class="action primary"
            onclick="openRepo('${escapeAttr(
              repo.name
            )}')"
          >
            📂 Buka Repository
          </button>

        </div>
      `;

    }).join("");
}


window.openRepo =
  async function(repoName) {

    currentRepo =
      repoName;

    currentPath =
      "";

    repoView.classList.add(
      "hidden"
    );

    fileView.classList.remove(
      "hidden"
    );

    await loadBranches();

    await loadContents();
  };


/* =========================
   BRANCHES
========================= */

async function loadBranches() {

  showLoading(
    "Memuat branch..."
  );

  try {

    const branches =
      await api(
        `/api/github/branches?owner=${encodeURIComponent(
          currentUser.login
        )}&repo=${encodeURIComponent(
          currentRepo
        )}`
      );

    branchSelect.innerHTML =
      "";

    for (
      const branch of branches
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        branch.name;

      option.textContent =
        branch.name;

      branchSelect.appendChild(
        option
      );
    }

    if (branches.length) {

      currentBranch =
        branches[0].name;

      branchSelect.value =
        currentBranch;
    }

  } catch(error) {

    branchSelect.innerHTML =
      "<option>main</option>";

    currentBranch =
      "main";

  } finally {

    hideLoading();
  }
}


branchSelect.addEventListener(
  "change",
  async () => {

    currentBranch =
      branchSelect.value;

    await loadContents();
  }
);


/* =========================
   FILES
========================= */

async function loadContents() {

  showLoading(
    "Memuat file..."
  );

  try {

    const url =
      `/api/github/contents` +
      `?owner=${encodeURIComponent(
        currentUser.login
      )}` +
      `&repo=${encodeURIComponent(
        currentRepo
      )}` +
      `&path=${encodeURIComponent(
        currentPath
      )}` +
      `&ref=${encodeURIComponent(
        currentBranch
      )}`;

    const items =
      await api(url);

    currentItems =
      Array.isArray(items)
        ? items
        : [items];

    renderFiles(
      currentItems
    );

    breadcrumb.textContent =
      currentPath
        ? `📁 ${currentRepo} / ${currentPath}`
        : `📁 ${currentRepo}`;

  } catch(error) {

    fileList.innerHTML =
      `<div style="padding:20px;color:#ff8c9b">
        ${escapeHtml(
          error.message
        )}
      </div>`;

  } finally {

    hideLoading();
  }
}


function renderFiles(items) {

  if (!items.length) {

    fileList.innerHTML =
      `<div style="padding:25px;text-align:center;color:#8f96a8">
        Folder kosong
      </div>`;

    return;
  }

  fileList.innerHTML =
    items.map(
      (item,index) => {

        const icon =
          item.type === "dir"
            ? "📁"
            : getFileIcon(
                item.name
              );

        return `
          <div class="file-row">

            <div class="file-icon">
              ${icon}
            </div>

            <div class="file-info">

              <div class="file-name">
                ${escapeHtml(
                  item.name
                )}
              </div>

              <div class="file-type">
                ${item.type}
              </div>

            </div>

            <div class="file-actions">

              <button
                class="small-btn"
                onclick="itemAction(${index})"
                title="Aksi"
              >
                ⋯
              </button>

            </div>

          </div>
        `;
      }
    ).join("");
}


window.itemAction =
  async function(index) {

    const item =
      currentItems[index];

    if (!item) return;

    if (
      item.type === "dir"
    ) {

      currentPath =
        joinPath(
          currentPath,
          item.name
        );

      await loadContents();

      return;
    }

    openFileActions(
      item
    );
  };


/* =========================
   FILE ACTIONS
========================= */

function openFileActions(
  item
) {

  modalTitle.textContent =
    `📄 ${item.name}`;

  modalContent.innerHTML = `
    <div style="
      display:grid;
      gap:10px;
    ">

      <button
        class="action"
        id="previewAction"
      >
        👁️ Preview
      </button>

      <button
        class="action"
        id="editAction"
      >
        ✍️ Edit
      </button>

      <button
        class="action"
        id="renameAction"
      >
        ✏️ Rename
      </button>

      <button
        class="action"
        id="downloadAction"
      >
        ⬇️ Download
      </button>

      <button
        class="action"
        id="deleteAction"
      >
        🗑️ Delete
      </button>

    </div>
  `;

  modalSubmit.classList.add(
    "hidden"
  );

  modal.classList.remove(
    "hidden"
  );

  $("previewAction")
    .onclick =
      () => previewFile(item);

  $("editAction")
    .onclick =
      () => editFile(item);

  $("renameAction")
    .onclick =
      () => renameFile(item);

  $("downloadAction")
    .onclick =
      () => downloadFile(item);

  $("deleteAction")
    .onclick =
      () => deleteFile(item);
}


/* =========================
   PREVIEW
========================= */

async function previewFile(
  item
) {

  closeModal();

  showLoading(
    "Mengambil file..."
  );

  try {

    const data =
      await api(
        `/api/github/file` +
        `?owner=${encodeURIComponent(
          currentUser.login
        )}` +
        `&repo=${encodeURIComponent(
          currentRepo
        )}` +
        `&path=${encodeURIComponent(
          item.path
        )}` +
        `&ref=${encodeURIComponent(
          currentBranch
        )}`
      );

    let content = "";

    if (data.content) {

      try {

        content =
          decodeURIComponent(
            escape(
              atob(
                String(
                  data.content
                ).replace(
                  /\s+/g,
                  ""
                )
              )
            )
          );

      } catch {

        content =
          atob(
            String(
              data.content
            ).replace(
              /\s+/g,
              ""
            )
          );
      }
    }

    const ext =
      getExtension(
        item.name
      );

    if (
      isImage(ext)
    ) {

      openPreviewModal(
        item.name,
        `<img
          class="preview"
          src="data:${mimeType(
            ext
          )};base64,${String(
            data.content
          ).replace(
            /\s+/g,
            ""
          )}"
        >`
      );

      return;
    }

    if (
      isVideo(ext)
    ) {

      openPreviewModal(
        item.name,
        `<video
          class="preview"
          controls
          src="data:${mimeType(
            ext
          )};base64,${String(
            data.content
          ).replace(
            /\s+/g,
            ""
          )}"
        ></video>`
      );

      return;
    }

    openPreviewModal(
      item.name,
      `<pre class="code">${escapeHtml(
        content
      )}</pre>`);

} catch(error) {

alert(
  "Preview gagal: " +
  error.message
);

} finally {

hideLoading();

}
}

async function uploadFile(
file
) {

showLoading(
"Upload ${file.name}..."
);

try {

const base64 =
  await fileToBase64(
    file
  );

const path =
  joinPath(
    currentPath,
    file.name
  );

const existing =
  currentItems.find(
    x =>
      x.path === path
  );

await api(
  "/api/github/upload",
  {
    method:"POST",

    body:
      JSON.stringify({
        owner:
          currentUser.login,

        repo:
          currentRepo,

        path,

        content:
          base64,

        sha:
          existing?.sha,

        branch:
          currentBranch,

        message:
          existing
            ? `Update ${path}`
            : `Upload ${path}`
      })
  }
);

} catch(error) {

alert(
  `Upload ${file.name} gagal: ` +
  error.message
);

} finally {

hideLoading();

}
}

function fileToBase64(
file
) {

return new Promise(
(resolve,reject) => {

  const reader =
    new FileReader();

  reader.onload =
    () => {

      const result =
        String(
          reader.result
        );

      const comma =
        result.indexOf(",");

      resolve(
        comma === -1
          ? result
          : result.slice(
              comma + 1
            )
      );
    };

  reader.onerror =
    reject;

  reader.readAsDataURL(
    file
  );
}

);
}

/* =========================
HELPERS
========================= */

function escapeHtml(value) {

return String(
value ?? ""
)
.replace(
/&/g,
"&"
)
.replace(
/</g,
"<"
)
.replace(
/>/g,
">"
)
.replace(
/"/g,
"""
)
.replace(
/'/g,
"'"
);
}

function escapeAttr(value) {
return escapeHtml(value);
}

function joinPath(
a,
b
) {

if (!a) return b;

return (
a.replace(
//+$/,
""
) +
"/" +
b.replace(
/^/+/,
""
)
);
}

function getExtension(
filename
) {

const parts =
filename
.split(".");

return parts.length > 1
? parts.pop().toLowerCase()
: "";
}

function isImage(ext) {

return [
"png",
"jpg",
"jpeg",
"gif",
"webp",
"bmp",
"svg"
].includes(ext);
}

function isVideo(ext) {

return [
"mp4",
"webm",
"ogg",
"mov"
].includes(ext);
}

function mimeType(ext) {

const map = {
png:"image/png",
jpg:"image/jpeg",
jpeg:"image/jpeg",
gif:"image/gif",
webp:"image/webp",
bmp:"image/bmp",
svg:"image/svg+xml",

mp4:"video/mp4",
webm:"video/webm",
ogg:"video/ogg",
mov:"video/quicktime"

};

return (
map[ext] ||
"application/octet-stream"
);
}

function getFileIcon(
name
) {

const ext =
getExtension(name);

if (isImage(ext))
return "🖼️";

if (isVideo(ext))
return "🎬";

if (
[
"js",
"ts",
"jsx",
"tsx"
].includes(ext)
)
return "📜";

if (
[
"html",
"css"
].includes(ext)
)
return "🌐";

if (
[
"json",
"xml",
"yaml",
"yml"
].includes(ext)
)
return "📋";

if (
[
"zip",
"rar",
"7z"
].includes(ext)
)
return "📦";

return "📄";
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {

  const password = document.getElementById("password").value;

  if (!password) {
    alert("Password kosong");
    return;
  }

  const button = document.getElementById("loginButton");

  button.disabled = true;
  button.textContent = "⏳ Login...";

  try {
    const response = await fetch(
      "https://yasam-git-backend.vercel.app/api/login",
      {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          password: password
        })
      }
    );

    const data = await response.json();

    console.log("LOGIN RESPONSE:", data);

    if (!response.ok) {
      alert(
        "❌ Login gagal\n\n" +
        (data.error || "Unknown error")
      );
      return;
    }

    if (data.ok) {
      alert("✅ Login berhasil!");

      // Cek session setelah login
      const sessionResponse = await fetch(
        "https://yasam-git-backend.vercel.app/api/session",
        {
          method: "GET",
          credentials: "include"
        }
      );

      const session =
        await sessionResponse.json();

      console.log(
        "SESSION RESPONSE:",
        session
      );

      alert(
        "Session:\n" +
        JSON.stringify(
          session,
          null,
          2
        )
      );
    }

  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    alert(
      "❌ Tidak bisa terhubung ke backend\n\n" +
      error.message
    );

  } finally {

    button.disabled = false;
    button.textContent = "🔐 Login";
  }
});
