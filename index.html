<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Multi Uploader</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#0d1117;
    color:#fff;
    padding:20px;
}

.container{
    width:100%;
    max-width:750px;
    margin:auto;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:18px;
    padding:22px;
}

h2{
    text-align:center;
    margin:0 0 20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    color:#8b949e;
    font-size:14px;
}

input,
select,
button{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #30363d;
    background:#0d1117;
    color:#fff;
    outline:none;
}

input:focus,
select:focus{
    border-color:#58a6ff;
}

button{
    margin-top:12px;
    border:0;
    background:#238636;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#2ea043;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.secondary{
    background:#21262d;
}

.danger{
    background:#da3633;
}

.hidden{
    display:none;
}

.info{
    padding:13px;
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:10px;
    margin-bottom:15px;
    color:#8b949e;
}

.dropzone{
    margin-top:18px;
    border:2px dashed #30363d;
    border-radius:14px;
    min-height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    cursor:pointer;
    transition:.2s;
}

.dropzone:hover{
    border-color:#58a6ff;
}

.dropzone.dragover{
    border-color:#2ea043;
    background:#0d2818;
}

.drop-title{
    font-size:18px;
    font-weight:bold;
}

.drop-sub{
    color:#8b949e;
    font-size:13px;
    margin-top:8px;
}

.drop-buttons{
    margin-top:15px;
}

.drop-buttons button{
    width:auto;
    padding:10px 15px;
    margin:5px;
}

.tree{
    margin-top:18px;
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:12px;
    padding:14px;
    max-height:350px;
    overflow:auto;
}

.tree-title{
    font-weight:bold;
    margin-bottom:10px;
}

.tree-item{
    padding:5px 0;
    font-size:13px;
    white-space:nowrap;
}

.folder{
    color:#f0c674;
}

.file{
    color:#c9d1d9;
}

.status{
    margin-top:15px;
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:10px;
    padding:12px;
    white-space:pre-wrap;
    font-size:13px;
}

.progress{
    margin-top:12px;
    height:9px;
    background:#30363d;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#238636;
    transition:.2s;
}

.count{
    color:#8b949e;
    font-size:12px;
    margin-top:7px;
}

</style>
</head>

<body>

<div class="container">

<h2>🚀 GitHub Multi Uploader</h2>


<!-- LOGIN -->

<div id="loginArea">

    <label>GitHub Token</label>

    <input
        id="token"
        type="password"
        placeholder="github_pat_..."
        autocomplete="off"
    >

    <button onclick="connectGitHub()">
        🔗 Connect GitHub
    </button>

</div>


<!-- APP -->

<div id="appArea" class="hidden">

    <div class="info">
        👤 GitHub Account:
        <b id="account"></b>
    </div>


    <label>Repository</label>

    <select id="repo" onchange="loadBranches()">
        <option value="">
            -- Pilih Repository --
        </option>
    </select>

    <div
        id="repoCount"
        class="count">
    </div>


    <label>Branch</label>

    <select id="branch">
        <option value="">
            Pilih repository dahulu
        </option>
    </select>


    <!-- DROPZONE -->

    <div
        id="dropzone"
        class="dropzone">

        <div>

            <div class="drop-title">
                📁 Drag & Drop File / Folder
            </div>

            <div class="drop-sub">
                Kamu bisa memasukkan banyak file dan
                beberapa folder sekaligus.
            </div>

            <div class="drop-buttons">

                <button
                    type="button"
                    onclick="event.stopPropagation();document.getElementById('fileInput').click()">
                    📄 Pilih File
                </button>

                <button
                    type="button"
                    onclick="event.stopPropagation();document.getElementById('folderInput').click()">
                    📁 Pilih Folder
                </button>

            </div>

        </div>

    </div>


    <!-- FILE INPUT -->

    <input
        id="fileInput"
        type="file"
        multiple
        style="display:none"
    >


    <!-- FOLDER INPUT -->

    <input
        id="folderInput"
        type="file"
        webkitdirectory
        directory
        multiple
        style="display:none"
    >


    <!-- PREVIEW -->

    <div
        id="tree"
        class="tree">

        <div class="tree-title">
            📂 Preview
        </div>

        <div id="treeContent">
            Belum ada file.
        </div>

    </div>


    <div
        id="fileCount"
        class="count">
        0 file
    </div>


    <!-- BUTTONS -->

    <button
        id="uploadBtn"
        onclick="uploadFiles()">

        ⬆️ Upload ke GitHub

    </button>


    <button
        class="secondary"
        onclick="clearFiles()">

        🧹 Bersihkan File

    </button>


    <button
        class="secondary"
        onclick="refreshRepos()">

        🔄 Scan Repository

    </button>


    <button
        class="danger"
        onclick="logout()">

        🚪 Logout

    </button>


    <!-- PROGRESS -->

    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar">
        </div>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status">

        Siap.

    </div>

</div>

</div>


<script>


/* =====================================
   GLOBAL
===================================== */

let token = "";

let selectedFiles = new Map();


/*
    Map digunakan supaya file duplikat
    tidak masuk dua kali.

    Key:
    path file
*/


/* =====================================
   GITHUB FETCH
===================================== */

async function githubFetch(url, options={}){

    return fetch(url,{

        ...options,

        headers:{

            "Authorization":
                "Bearer " + token,

            "Accept":
                "application/vnd.github+json",

            "X-GitHub-Api-Version":
                "2022-11-28",

            ...(options.headers || {})

        }

    });

}


/* =====================================
   CONNECT
===================================== */

async function connectGitHub(){

    token =
        document
        .getElementById("token")
        .value
        .trim();


    if(!token){

        alert("Masukkan GitHub Token.");

        return;

    }


    setStatus(
        "🔄 Menghubungkan ke GitHub..."
    );


    try{

        const response =
            await githubFetch(
                "https://api.github.com/user"
            );


        if(!response.ok){

            throw new Error(
                "Token tidak valid atau sudah expired."
            );

        }


        const user =
            await response.json();


        document
        .getElementById("account")
        .textContent =
            user.login;


        document
        .getElementById("loginArea")
        .classList
        .add("hidden");


        document
        .getElementById("appArea")
        .classList
        .remove("hidden");


        await loadRepos();


    }catch(error){

        setStatus(
            "❌ Gagal connect:\n"+
            error.message
        );

    }

}


/* =====================================
   LOAD REPOSITORIES
===================================== */

async function loadRepos(){

    const select =
        document.getElementById("repo");


    select.innerHTML =
        "<option>🔄 Scanning repository...</option>";


    try{

        let repos = [];

        let page = 1;


        while(true){

            const response =
                await githubFetch(

                    `https://api.github.com/user/repos?per_page=100&page=${page}&sort=updated`

                );


            if(!response.ok){

                const error =
                    await response.json();

                throw new Error(
                    error.message ||
                    "Gagal mengambil repository."
                );

            }


            const data =
                await response.json();


            repos.push(...data);


            if(data.length < 100)
                break;


            page++;

        }


        select.innerHTML =
            `<option value="">
                -- Pilih Repository --
            </option>`;


        repos.forEach(repo=>{

            const option =
                document.createElement("option");


            option.value =
                repo.full_name;


            option.textContent =
                repo.name +
                (
                    repo.private
                    ? " 🔒"
                    : " 🌐"
                );


            select.appendChild(option);

        });


        document
        .getElementById("repoCount")
        .textContent =
            `${repos.length} repository ditemukan.`;


        setStatus(
            `✅ GitHub terhubung.\n`+
            `${repos.length} repository ditemukan.`
        );


    }catch(error){

        select.innerHTML =
            `<option>
                ❌ Gagal scan repository
            </option>`;


        setStatus(
            "❌ "+error.message
        );

    }

}


/* =====================================
   REFRESH REPOS
===================================== */

async function refreshRepos(){

    if(!token)
        return;


    await loadRepos();

}


/* =====================================
   LOAD BRANCHES
===================================== */

async function loadBranches(){

    const repo =
        document
        .getElementById("repo")
        .value;


    const branch =
        document
        .getElementById("branch");


    if(!repo){

        branch.innerHTML =
            "<option>Pilih repository dahulu</option>";

        return;

    }


    branch.innerHTML =
        "<option>🔄 Memuat branch...</option>";


    try{

        let branches = [];

        let page = 1;


        while(true){

            const response =
                await githubFetch(

                    `https://api.github.com/repos/${repo}/branches?per_page=100&page=${page}`

                );


            if(!response.ok){

                throw new Error(
                    "Gagal mengambil branch."
                );

            }


            const data =
                await response.json();


            branches.push(...data);


            if(data.length < 100)
                break;


            page++;

        }


        branch.innerHTML = "";


        branches.forEach(item=>{

            const option =
                document.createElement("option");


            option.value =
                item.name;


            option.textContent =
                item.name;


            branch.appendChild(option);

        });


    }catch(error){

        branch.innerHTML =
            "<option>Gagal memuat branch</option>";


        setStatus(
            "❌ "+error.message
        );

    }

}


/* =====================================
   FILE INPUT
===================================== */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(){

        for(const file of this.files){

            addFile(
                file,
                file.name
            );

        }

        updatePreview();

    }
);


/* =====================================
   FOLDER INPUT
===================================== */

document
.getElementById("folderInput")
.addEventListener(
    "change",
    function(){

        for(const file of this.files){

            /*
                webkitRelativePath:
                folder/index.html
            */

            const path =
                file.webkitRelativePath ||
                file.name;


            /*
                Hapus folder root pertama.

                contoh:

                project/index.js

                menjadi:

                index.js
            */

            const parts =
                path.split("/");


            if(parts.length > 1){

                parts.shift();

            }


            const cleanPath =
                parts.join("/");


            addFile(
                file,
                cleanPath
            );

        }

        updatePreview();

    }
);


/* =====================================
   ADD FILE
===================================== */

function addFile(file,path){

    if(!path)
        path = file.name;


    path =
        path
        .replace(/^\/+/,"")
        .replace(/\/+/g,"/");


    /*
        Kalau file yang sama dipilih
        lagi, replace pilihan lama.
    */

    selectedFiles.set(
        path,
        {
            file:file,
            path:path
        }
    );

}


/* =====================================
   DRAG DROP
===================================== */

const dropzone =
    document.getElementById("dropzone");


dropzone.addEventListener(
    "dragover",
    function(event){

        event.preventDefault();

        dropzone.classList.add(
            "dragover"
        );

    }
);


dropzone.addEventListener(
    "dragleave",
    function(){

        dropzone.classList.remove(
            "dragover"
        );

    }
);


dropzone.addEventListener(
    "drop",
    async function(event){

        event.preventDefault();

        dropzone.classList.remove(
            "dragover"
        );


        const items =
            event.dataTransfer.items;


        /*
            Chrome / Edge / Android Chromium
            biasanya mendukung
            webkitGetAsEntry().
        */

        for(
            const item of items
        ){

            const entry =
                item.webkitGetAsEntry
                ? item.webkitGetAsEntry()
                : null;


            if(entry){

                await readEntry(
                    entry,
                    ""
                );

            }else{

                const file =
                    item.getAsFile();


                if(file){

                    addFile(
                        file,
                        file.name
                    );

                }

            }

        }


        updatePreview();

    }
);


/* =====================================
   READ ENTRY
===================================== */

async function readEntry(
    entry,
    parentPath
){

    if(entry.isFile){

        await new Promise(
            resolve=>{

                entry.file(
                    file=>{

                        const path =
                            parentPath
                            ? parentPath+
                              "/"+
                              file.name
                            : file.name;


                        addFile(
                            file,
                            path
                        );


                        resolve();

                    }
                );

            }
        );

        return;

    }


    if(entry.isDirectory){

        const reader =
            entry.createReader();


        await readDirectory(
            reader,
            parentPath
            ? parentPath+
              "/"+
              entry.name
            : entry.name
        );

    }

}


/* =====================================
   READ DIRECTORY
===================================== */

async function readDirectory(
    reader,
    path
){

    while(true){

        const entries =
            await new Promise(
                resolve=>{

                    reader.readEntries(
                        resolve
                    );

                }
            );


        if(!entries.length)
            break;


        for(
            const entry of entries
        ){

            await readEntry(
                entry,
                path
            );

        }

    }

}


/* =====================================
   PREVIEW
===================================== */

function updatePreview(){

    const tree =
        document
        .getElementById("treeContent");


    const count =
        document
        .getElementById("fileCount");


    tree.innerHTML = "";


    if(selectedFiles.size === 0){

        tree.textContent =
            "Belum ada file.";

        count.textContent =
            "0 file";

        return;

    }


    const root = {};


    /*
        Buat tree.
    */

    for(
        const [path] of selectedFiles
    ){

        const parts =
            path.split("/");


        let current =
            root;


        parts.forEach(
            (part,index)=>{

                if(!current[part]){

                    current[part] = {
                        __file:
                            index ===
                            parts.length-1
                    };

                }


                current =
                    current[part];

            }
        );

    }


    renderTree(
        root,
        tree,
        0
    );


    count.textContent =
        `${selectedFiles.size} file`;

}


/* =====================================
   RENDER TREE
===================================== */

function renderTree(
    obj,
    container,
    level
){

    const keys =
        Object.keys(obj)
        .sort((a,b)=>{

            const af =
                obj[a].__file;

            const bf =
                obj[b].__file;


            if(af !== bf)
                return af ? 1 : -1;


            return a.localeCompare(b);

        });


    keys.forEach(name=>{

        const item =
            obj[name];


        const div =
            document.createElement("div");


        div.className =
            "tree-item";


        div.style.paddingLeft =
            (level*18)+"px";


        if(item.__file){

            div.classList.add(
                "file"
            );


            div.textContent =
                "📄 "+name;

        }else{

            div.classList.add(
                "folder"
            );


            div.textContent =
                "📁 "+name;

        }


        container.appendChild(div);


        if(!item.__file){

            renderTree(
                item,
                container,
                level+1
            );

        }

    });

}


/* =====================================
   BASE64
===================================== */

function arrayBufferToBase64(
    buffer
){

    let binary = "";

    const bytes =
        new Uint8Array(buffer);


    const chunk =
        0x8000;


    for(
        let i=0;
        i<bytes.length;
        i+=chunk
    ){

        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    Math.min(
                        i+chunk,
                        bytes.length
                    )
                )
            );

    }


    return btoa(binary);

}


/* =====================================
   ENCODE PATH
===================================== */

function encodePath(path){

    return path
        .split("/")
        .map(
            part =>
                encodeURIComponent(part)
        )
        .join("/");

}


/* =====================================
   UPLOAD FILES
===================================== */

async function uploadFiles(){

    const repo =
        document
        .getElementById("repo")
        .value;


    const branch =
        document
        .getElementById("branch")
        .value;


    if(!repo){

        alert(
            "Pilih repository terlebih dahulu."
        );

        return;

    }


    if(!branch){

        alert(
            "Pilih branch terlebih dahulu."
        );

        return;

    }


    if(selectedFiles.size === 0){

        alert(
            "Pilih file atau folder."
        );

        return;

    }


    const files =
        Array.from(
            selectedFiles.values()
        );


    const btn =
        document
        .getElementById("uploadBtn");


    btn.disabled = true;


    let success = 0;

    let failed = 0;


    for(
        let i=0;
        i<files.length;
        i++
    ){

        const item =
            files[i];


        try{

            setStatus(
                `⬆️ Upload ${i+1}/${files.length}\n\n`+
                `📄 ${item.path}`
            );


            /*
                Baca file.
            */

            const buffer =
                await item.file
                .arrayBuffer();


            const content =
                arrayBufferToBase64(
                    buffer
                );


            /*
                Cek file apakah sudah ada.
            */

            const check =
                await githubFetch(

                    `https://api.github.com/repos/${repo}/contents/${encodePath(item.path)}?ref=${encodeURIComponent(branch)}`

                );


            let sha = null;


            if(check.ok){

                const existing =
                    await check.json();


                if(
                    existing.type ===
                    "file"
                ){

                    sha =
                        existing.sha;

                }

            }


            /*
                Upload.
            */

            const body = {

                message:
                    sha
                    ? `Update ${item.path}`
                    : `Upload ${item.path}`,

                content:
                    content,

                branch:
                    branch

            };


            /*
                SHA wajib untuk replace.
            */

            if(sha){

                body.sha =
                    sha;

            }


            const response =
                await githubFetch(

                    `https://api.github.com/repos/${repo}/contents/${encodePath(item.path)}`,

                    {

                        method:"PUT",

                        headers:{

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(body)

                    }

                );


            const result =
                await response.json();


            if(!response.ok){

                throw new Error(
                    result.message ||
                    "Upload gagal."
                );

            }


            success++;


            const percent =
                Math.round(
                    (
                        (i+1) /
                        files.length
                    ) * 100
                );


            document
            .getElementById(
                "progressBar"
            )
            .style.width =
                percent+"%";


        }catch(error){

            failed++;


            console.error(
                item.path,
                error
            );


            setStatus(
                `❌ Gagal\n\n`+
                `${item.path}\n\n`+
                `${error.message}`
            );

        }

    }


    btn.disabled = false;


    setStatus(
        `✅ UPLOAD SELESAI\n\n`+
        `Berhasil : ${success}\n`+
        `Gagal    : ${failed}\n`+
        `Total    : ${files.length}`
    );

}


/* =====================================
   CLEAR
===================================== */

function clearFiles(){

    selectedFiles.clear();


    document
    .getElementById(
        "fileInput"
    )
    .value = "";


    document
    .getElementById(
        "folderInput"
    )
    .value = "";


    document
    .getElementById(
        "progressBar"
    )
    .style.width =
        "0%";


    updatePreview();


    setStatus(
        "🧹 File berhasil dibersihkan."
    );

}


/* =====================================
   STATUS
===================================== */

function setStatus(text){

    document
    .getElementById("status")
    .textContent =
        text;

}


/* =====================================
   LOGOUT
===================================== */

function logout(){

    token = "";

    clearFiles();


    document
    .getElementById("token")
    .value = "";


    document
    .getElementById("appArea")
    .classList
    .add("hidden");


    document
    .getElementById("loginArea")
    .classList
    .remove("hidden");


    setStatus(
        "Siap."
    );

}

</script>

</body>
</html>
