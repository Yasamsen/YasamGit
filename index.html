<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>YasamGit V5.2</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#0b0f14;
  color:#e8edf3;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#0f141b;
  border-bottom:1px solid #202832;
  padding:12px 14px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo small{
  color:#8d99a8;
  font-size:11px;
  font-weight:500;
}

.user-area{
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#202832;
  display:grid;
  place-items:center;
  font-size:14px;
}

main{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:14px;
  padding-bottom:70px;
}

.card{
  background:#11171e;
  border:1px solid #202832;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.login-wrap{
  width:min(420px,calc(100% - 28px));
  margin:auto;
  padding-top:8vh;
}

.login-logo{
  text-align:center;
  margin-bottom:20px;
}

.login-logo h1{
  margin:0 0 5px;
  font-size:30px;
}

.login-logo p{
  margin:0;
  color:#8d99a8;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#aeb8c4;
}

input,textarea,select{
  width:100%;
  border:1px solid #29333e;
  background:#0b1016;
  color:#edf2f7;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:#617080;
}

textarea{
  min-height:180px;
  resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

.btn{
  border:1px solid #29333e;
  background:#182029;
  color:#edf2f7;
  border-radius:9px;
  padding:9px 12px;
  min-height:40px;
  transition:.15s;
}

.btn:active{
  transform:scale(.97);
}

.btn.primary{
  background:#e8edf3;
  color:#0b0f14;
  border-color:#e8edf3;
  font-weight:700;
}

.btn.danger{
  background:#29181c;
  border-color:#54262e;
}

.btn.small{
  min-height:34px;
  padding:7px 9px;
  font-size:13px;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.wrap{
  flex-wrap:wrap;
}

.grow{
  flex:1;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.toolbar input{
  min-width:180px;
  flex:1;
}

.repo-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:10px;
}

.repo{
  border:1px solid #202832;
  background:#0f141b;
  border-radius:12px;
  padding:13px;
  cursor:pointer;
}

.repo:hover{
  border-color:#44515e;
}

.repo-name{
  font-weight:750;
  word-break:break-word;
}

.repo-desc{
  color:#8995a3;
  font-size:13px;
  margin-top:6px;
  min-height:34px;
}

.repo-meta{
  display:flex;
  gap:8px;
  margin-top:10px;
  color:#8995a3;
  font-size:12px;
}

.breadcrumb{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
  color:#aeb8c4;
  font-size:13px;
  margin-bottom:12px;
}

.crumb{
  border:0;
  background:none;
  color:#dce4ec;
  padding:3px;
}

.file-list{
  border:1px solid #202832;
  border-radius:12px;
  overflow:hidden;
}

.file{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border-bottom:1px solid #202832;
  min-height:54px;
}

.file:last-child{
  border-bottom:0;
}

.file:hover{
  background:#151c24;
}

.file-icon{
  width:30px;
  text-align:center;
  flex:none;
}

.file-main{
  min-width:0;
  flex:1;
}

.file-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.file-size{
  color:#7f8b99;
  font-size:11px;
  margin-top:2px;
}

.file-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#788594;
}

.status{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:100;
  background:#171e27;
  border:1px solid #34404c;
  border-radius:999px;
  padding:9px 15px;
  box-shadow:0 8px 30px #0008;
  max-width:calc(100% - 30px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  background:#000b;
  display:grid;
  place-items:center;
  padding:15px;
}

.modal-box{
  width:min(800px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11171e;
  border:1px solid #29333e;
  border-radius:15px;
  padding:15px;
}

.modal-title{
  font-size:18px;
  font-weight:750;
  margin-bottom:13px;
}

.preview img,
.preview video{
  max-width:100%;
  max-height:65vh;
  display:block;
  margin:auto;
  border-radius:9px;
}

.preview pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#0a0e13;
  padding:12px;
  border-radius:9px;
  overflow:auto;
  max-height:65vh;
}

.progress{
  height:5px;
  background:#202832;
  border-radius:5px;
  overflow:hidden;
  margin-top:10px;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:#e8edf3;
  transition:width .15s;
}

.notice{
  padding:10px;
  border:1px solid #29333e;
  border-radius:9px;
  color:#9da9b7;
  font-size:13px;
}

@media(max-width:650px){
  header{
    padding:10px;
  }

  main{
    padding:10px;
    padding-bottom:80px;
  }

  .repo-grid{
    grid-template-columns:1fr;
  }

  .file{
    align-items:flex-start;
  }

  .file-actions{
    max-width:125px;
  }

  .file-actions .btn{
    font-size:11px;
    padding:6px;
    min-height:31px;
  }

  .toolbar>*{
    width:100%;
  }

  .toolbar .btn{
    width:auto;
  }

  .header-inner{
    align-items:flex-start;
  }

  .user-area span{
    display:none;
  }
}
</style>
</head>

<body>

<div id="app" class="app">

<header id="header" class="hidden">
  <div class="header-inner">
    <div class="logo">
      YasamGit
      <small>V5.2</small>
    </div>

    <div class="user-area">
      <div class="avatar" id="avatar">?</div>
      <span id="username">...</span>
      <button class="btn small" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<!-- LOGIN -->

<section id="loginPage">

  <div class="login-wrap">

    <div class="login-logo">
      <h1>🔐 YasamGit</h1>
      <p>GitHub Manager V5.2</p>
    </div>

    <div class="card">

      <label>Password Admin</label>

      <input
        id="password"
        type="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()"
      >

      <div style="height:10px"></div>

      <button
        id="loginBtn"
        class="btn primary"
        style="width:100%"
        onclick="login()"
      >
        🔐 Login
      </button>

      <div style="height:12px"></div>

      <div class="notice">
        Password divalidasi oleh backend Vercel.
        GitHub Token tidak disimpan di halaman ini.
      </div>

    </div>

  </div>

</section>

<!-- MAIN -->

<main id="mainPage" class="hidden">

  <div class="card">

    <div class="row wrap">

      <div class="grow">
        <b id="pageTitle">Repository</b>
        <div
          id="pageSub"
          style="color:#7f8b99;font-size:12px;margin-top:3px"
        >
          Repository GitHub kamu
        </div>
      </div>

      <button
        class="btn small"
        onclick="showRepos()"
      >
        📁 Repo
      </button>

      <button
        class="btn small"
        onclick="createRepository()"
      >
        ➕ Repo
      </button>

      <button
        class="btn small"
        onclick="loadCurrent()"
      >
        🔄
      </button>

    </div>

  </div>

  <!-- REPOSITORIES -->

  <section id="repoSection">

    <div class="toolbar">

      <input
        id="repoSearch"
        placeholder="🔍 Cari repository..."
        oninput="filterRepos()"
      >

    </div>

    <div id="repoGrid" class="repo-grid"></div>

  </section>

  <!-- FILES -->

  <section id="fileSection" class="hidden">

    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="toolbar">

      <input
        id="fileSearch"
        placeholder="🔍 Cari file..."
        oninput="renderFiles()"
      >

      <button
        class="btn"
        onclick="uploadPicker()"
      >
        📤 Upload
      </button>

      <button
        class="btn"
        onclick="createFolder()"
      >
        📁 Folder
      </button>

      <input
        id="uploadInput"
        type="file"
        multiple
        hidden
        onchange="handleUpload(this.files)"
      >

    </div>

    <div id="fileList" class="file-list"></div>

  </section>

</main>

<div id="status" class="status hidden">...</div>

<!-- MODAL -->

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="row">
      <div class="modal-title grow" id="modalTitle">...</div>
      <button class="btn small" onclick="closeModal()">✕</button>
    </div>

    <div id="modalBody"></div>
  </div>
</div>

<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://GANTI-DENGAN-URL-VERCEL-KAMU.vercel.app";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let repositories = [];
let currentRepo = null;
let currentPath = "";
let currentFiles = [];
let busy = false;


/* =========================================================
   API
========================================================= */

async function api(path, options = {}) {

  const response = await fetch(
    API_URL + path,
    {
      credentials:"include",
      ...options,
      headers:{
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    }
  );

  let data;

  try {
    data = await response.json();
  } catch {
    data = {
      ok:false,
      error:"Response server tidak valid."
    };
  }

  if (
    response.status === 401 &&
    path !== "/api/login"
  ) {
    logoutLocal();
    throw new Error("Session habis.");
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      data.message ||
      `HTTP ${response.status}`
    );
  }

  return data;
}


/* =========================================================
   STATUS
========================================================= */

let statusTimer;

function setStatus(message, loading = false){

  const el =
    document.getElementById("status");

  el.classList.remove("hidden");

  el.textContent =
    loading
      ? `... ${message}`
      : message;

  clearTimeout(statusTimer);

  if(!loading){
    statusTimer =
      setTimeout(
        ()=>el.classList.add("hidden"),
        2500
      );
  }
}

function clearStatus(){
  document
    .getElementById("status")
    .classList.add("hidden");
}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  if(busy) return;

  const password =
    document
      .getElementById("password")
      .value;

  if(!password){
    setStatus("Password wajib diisi.");
    return;
  }

  busy = true;

  const btn =
    document.getElementById("loginBtn");

  btn.disabled = true;
  btn.textContent = "...";

  setStatus("Login", true);

  try{

    await api(
      "/api/login",
      {
        method:"POST",
        body:JSON.stringify({
          password
        })
      }
    );

    document
      .getElementById("password")
      .value = "";

    await enterApp();

  }catch(error){

    setStatus(
      error.message || "Login gagal."
    );

  }finally{

    busy = false;

    btn.disabled = false;
    btn.textContent = "🔐 Login";

  }
}


/* =========================================================
   SESSION
========================================================= */

async function checkSession(){

  try{

    const data =
      await api(
        "/api/session"
      );

    if(data.authenticated){
      await enterApp();
    }

  }catch{

    showLogin();

  }
}

async function enterApp(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("mainPage")
    .classList.remove("hidden");

  document
    .getElementById("header")
    .classList.remove("hidden");

  try{

    await loadUser();
    await loadRepos();

  }catch(error){

    setStatus(error.message);

  }
}

function showLogin(){

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("mainPage")
    .classList.add("hidden");

  document
    .getElementById("header")
    .classList.add("hidden");

}

function logoutLocal(){

  currentUser = null;
  repositories = [];
  currentRepo = null;
  currentFiles = [];

  showLogin();
}

async function logout(){

  try{

    await api(
      "/api/logout",
      {
        method:"POST"
      }
    );

  }catch{}

  logoutLocal();

  setStatus("Logout berhasil.");

}


/* =========================================================
   USER
========================================================= */

async function loadUser(){

  const data =
    await api(
      "/api/github/user"
    );

  currentUser = data;

  document
    .getElementById("username")
    .textContent =
      data.login || "...";

  document
    .getElementById("avatar")
    .textContent =
      (data.login || "?")
      .charAt(0)
      .toUpperCase();

}


/* =========================================================
   REPOSITORIES
========================================================= */

async function loadRepos(){

  setStatus(
    "Memuat repository",
    true
  );

  try{

    repositories =
      await api(
        "/api/github/repos?per_page=100"
      );

    if(!Array.isArray(repositories)){
      repositories = [];
    }

    renderRepos();

  }finally{

    clearStatus();

  }
}

function renderRepos(){

  const grid =
    document.getElementById(
      "repoGrid"
    );

  const query =
    document
      .getElementById("repoSearch")
      .value
      .trim()
      .toLowerCase();

  const list =
    repositories.filter(repo =>
      !query ||
      repo.name
        .toLowerCase()
        .includes(query) ||
      String(repo.description || "")
        .toLowerCase()
        .includes(query)
    );

  if(!list.length){

    grid.innerHTML =
      `<div class="empty">
        Tidak ada repository.
      </div>`;

    return;
  }

  grid.innerHTML =
    list.map(repo => {

      const visibility =
        repo.private
          ? "🔒 Private"
          : "🌐 Public";

      return `
        <div
          class="repo"
          onclick="openRepo('${escapeAttr(repo.owner.login)}','${escapeAttr(repo.name)}')"
        >

          <div class="repo-name">
            📁 ${escapeHtml(repo.name)}
          </div>

          <div class="repo-desc">
            ${escapeHtml(
              repo.description ||
              "Tidak ada deskripsi."
            )}
          </div>

          <div class="repo-meta">
            <span>${visibility}</span>
            <span>⭐ ${repo.stargazers_count || 0}</span>
            <span>🍴 ${repo.forks_count || 0}</span>
          </div>

        </div>
      `;

    }).join("");
}

function filterRepos(){
  renderRepos();
}


/* =========================================================
   OPEN REPOSITORY
========================================================= */

async function openRepo(owner, repo){

  currentRepo = {
    owner,
    repo
  };

  currentPath = "";

  document
    .getElementById("repoSection")
    .classList.add("hidden");

  document
    .getElementById("fileSection")
    .classList.remove("hidden");

  document
    .getElementById("pageTitle")
    .textContent =
      `${owner}/${repo}`;

  document
    .getElementById("pageSub")
    .textContent =
      "File & folder";

  await loadFiles();

}

function showRepos(){

  currentRepo = null;

  document
    .getElementById("fileSection")
    .classList.add("hidden");

  document
    .getElementById("repoSection")
    .classList.remove("hidden");

  document
    .getElementById("pageTitle")
    .textContent =
      "Repository";

  document
    .getElementById("pageSub")
    .textContent =
      "Repository GitHub kamu";

  renderRepos();

}


/* =========================================================
   FILES
========================================================= */

async function loadFiles(){

  if(!currentRepo) return;

  setStatus(
    "Memuat file",
    true
  );

  try{

    const params =
      new URLSearchParams({
        owner:currentRepo.owner,
        repo:currentRepo.repo,
        path:currentPath
      });

    const data =
      await api(
        "/api/github/contents?" +
        params.toString()
      );

    currentFiles =
      Array.isArray(data)
        ? data
        : [data];

    renderBreadcrumb();
    renderFiles();

  }catch(error){

    setStatus(
      error.message
    );

  }finally{

    clearStatus();

  }
}

function renderBreadcrumb(){

  const el =
    document.getElementById(
      "breadcrumb"
    );

  const parts =
    currentPath
      ? currentPath
        .split("/")
        .filter(Boolean)
      : [];

  let html =
    `<button
      class="crumb"
      onclick="goPath('')"
    >🏠</button>`;

  let path = "";

  parts.forEach((part,index)=>{

    path +=
      (path ? "/" : "") +
      part;

    html += `
      <span>/</span>
      <button
        class="crumb"
        onclick="goPath('${escapeAttr(path)}')"
      >
        ${escapeHtml(part)}
      </button>
    `;

  });

  el.innerHTML = html;
}

function renderFiles(){

  const container =
    document.getElementById(
      "fileList"
    );

  const query =
    document
      .getElementById("fileSearch")
      .value
      .trim()
      .toLowerCase();

  const files =
    currentFiles.filter(file =>
      !query ||
      file.name
        .toLowerCase()
        .includes(query)
    );

  if(!files.length){

    container.innerHTML =
      `<div class="empty">
        Folder kosong.
      </div>`;

    return;
  }

  const folders =
    files.filter(
      x => x.type === "dir"
    );

  const normalFiles =
    files.filter(
      x => x.type !== "dir"
    );

  const sorted =
    [...folders,...normalFiles];

  container.innerHTML =
    sorted.map(file => {

      const isFolder =
        file.type === "dir";

      const icon =
        isFolder ? "📁" : getFileIcon(file.name);

      return `
        <div
          class="file"
          data-path="${escapeAttr(file.path)}"
        >

          <div class="file-icon">
            ${icon}
          </div>

          <div
            class="file-main"
            onclick="${
              isFolder
                ? `goPath('${escapeAttr(file.path)}')`
                : `previewFile('${escapeAttr(file.path)}','${escapeAttr(file.name)}')`
            }"
          >

            <div class="file-name">
              ${escapeHtml(file.name)}
            </div>

            <div class="file-size">
              ${
                isFolder
                  ? "Folder"
                  : formatBytes(file.size || 0)
              }
            </div>

          </div>

          <div class="file-actions">

            ${
              !isFolder
              ? `
                <button
                  class="btn small"
                  onclick="previewFile('${escapeAttr(file.path)}','${escapeAttr(file.name)}')"
                >👁️</button>

                <button
                  class="btn small"
                  onclick="downloadFile('${escapeAttr(file.download_url || "")}','${escapeAttr(file.name)}')"
                >⬇️</button>

                <button
                  class="btn small"
                  onclick="editFile('${escapeAttr(file.path)}','${escapeAttr(file.name)}')"
                >✍️</button>
              `
              : ""
            }

            <button
              class="btn small"
              onclick="renameItem('${escapeAttr(file.path)}','${escapeAttr(file.name)}')"
            >✏️</button>

            <button
              class="btn small danger"
              onclick="deleteItem('${escapeAttr(file.path)}','${escapeAttr(file.name)}','${escapeAttr(file.sha)}')"
            >🗑️</button>

          </div>

        </div>
      `;

    }).join("");
}

async function goPath(path){

  currentPath = path;

  await loadFiles();

}


/* =========================================================
   UPLOAD
========================================================= */

function uploadPicker(){

  document
    .getElementById("uploadInput")
    .click();

}

async function handleUpload(files){

  if(!files || !files.length) return;

  if(!currentRepo) return;

  for(
    const file of Array.from(files)
  ){

    try{

      setStatus(
        `Upload ${file.name}`,
        true
      );

      const base64 =
        await fileToBase64(file);

      const path =
        currentPath
          ? `${currentPath}/${file.name}`
          : file.name;

      /*
       * Cek apakah file sudah ada.
       */

      let existing = null;

      try{

        existing =
          await api(
            `/api/github/file?` +
            new URLSearchParams({
              owner:currentRepo.owner,
              repo:currentRepo.repo,
              path
            })
          );

      }catch{}

      await api(
        "/api/github/upload",
        {
          method:"POST",
          body:JSON.stringify({
            owner:currentRepo.owner,
            repo:currentRepo.repo,
            path,
            content:base64,
            sha:existing?.sha || null,
            message:
              `${existing?.sha ? "Update" : "Upload"} ${file.name}`
          })
        }
      );

      setStatus(
        `${file.name} berhasil.`
      );

    }catch(error){

      setStatus(
        `${file.name}: ${error.message}`
      );

    }

  }

  document
    .getElementById("uploadInput")
    .value = "";

  await loadFiles();

}

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload = () =>
        resolve(reader.result);

      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(
  url,
  name
){

  if(!url){

    setStatus(
      "Download URL tidak tersedia."
    );

    return;
  }

  const a =
    document.createElement("a");

  a.href = url;
  a.download = name;
  a.target = "_blank";
  a.rel = "noopener";

  document.body.appendChild(a);

  a.click();

  a.remove();

}


/* =========================================================
   PREVIEW
========================================================= */

async function previewFile(
  path,
  name
){

  setStatus(
    "Membuka preview",
    true
  );

  try{

    const data =
      await api(
        `/api/github/file?` +
        new URLSearchParams({
          owner:currentRepo.owner,
          repo:currentRepo.repo,
          path
        })
      );

    const ext =
      name
        .split(".")
        .pop()
        .toLowerCase();

    const imageExt =
      [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "bmp",
        "svg"
      ];

    const videoExt =
      [
        "mp4",
        "webm",
        "ogg",
        "mov"
      ];

    if(
      imageExt.includes(ext)
    ){

      openModal(
        `👁️ ${name}`,
        `
        <div class="preview">
          <img
            src="data:image/${ext === "jpg" ? "jpeg" : ext};base64,${data.content.replace(/\n/g,"")}"
          >
        </div>
        `
      );

    }else if(
      videoExt.includes(ext)
    ){

      const mime =
        ext === "mp4"
          ? "video/mp4"
          : ext === "webm"
            ? "video/webm"
            : "video/ogg";

      openModal(
        `🎬 ${name}`,
        `
        <div class="preview">
          <video
            controls
            playsinline
            src="data:${mime};base64,${data.content.replace(/\n/g,"")}"
          ></video>
        </div>
        `
      );

    }else{

      const binary =
        atob(
          data.content
            .replace(/\n/g,"")
        );

      const bytes =
        Uint8Array.from(
          binary,
          c => c.charCodeAt(0)
        );

      let text;

      try{

        text =
          new TextDecoder(
            "utf-8"
          ).decode(bytes);

      }catch{

        text =
          "[File binary tidak dapat ditampilkan sebagai teks]";

      }

      openModal(
        `👁️ ${name}`,
        `
        <div class="preview">
          <pre>${escapeHtml(text)}</pre>
        </div>
        `
      );

    }

  }catch(error){

    setStatus(
      error.message
    );

  }finally{

    clearStatus();

  }

}

async function editFile(

){

      );

async function saveEditedFile(
  path,
  name,
  sha
){

  const editor =
    document.getElementById(
      "editor"
    );

  if(!editor) return;

  setStatus(
    "Menyimpan",
    true
  );

  try{

    const encoded =
      new TextEncoder()
        .encode(editor.value);

    let binary = "";

    for(
      let i=0;
      i<encoded.length;
      i++
    ){
      binary +=
        String.fromCharCode(
          encoded[i]
        );
    }

    const base64 =
      btoa(binary);

    await api(
      "/api/github/upload",
      {
        method:"POST",
        body:JSON.stringify({
          owner:currentRepo.owner,
          repo:currentRepo.repo,
          path,
          content:base64,
          sha,
          message:
            `Edit ${name}`
        })
      }
    );

    closeModal();

    setStatus(
      "File berhasil disimpan."
    );

    await loadFiles();

  }catch(error){

    setStatus(
      error.message
    );

  }

}

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return escapeHtml(value)
    .replaceAll("\\","\\\\");
}

function formatBytes(bytes){

  if(!bytes) return "0 B";

  const units =
    [
      "B",
      "KB",
      "MB",
      "GB"
    ];

  let i=0;
  let n=Number(bytes);

  while(
    n >= 1024 &&
    i < units.length-1
  ){

    n /= 1024;
    i++;

  }

  return (
    n < 10 && i > 0
      ? n.toFixed(1)
      : Math.round(n)
  ) +
  " " +
  units[i];

}

      "html",

      "xml",

    ].includes(ext)
  ) return "📄";

  return "📄";

}
