<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <title>YasamGit V5.2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: #e5e7eb;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1100px, 100%);
      margin: auto;
      padding: 16px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .login {
      width: min(430px, 100%);
      margin: 10vh auto;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    p {
      color: #94a3b8;
      line-height: 1.5;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: white;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #3b82f6;
    }

    label {
      display: block;
      margin: 16px 0 7px;
    }

    textarea {
      min-height: 350px;
      resize: vertical;
      font-family: monospace;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .btn:hover {
      opacity: .9;
    }

    .danger {
      background: #dc2626;
    }

    .success {
      background: #059669;
    }

    .secondary {
      background: #334155;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .login-button {
      width: 100%;
      margin-top: 18px;
    }

    .status {
      padding: 11px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 14px;
    }

    .error {
      background: #450a0a;
      color: #fecaca;
    }

    .success-status {
      background: #052e16;
      color: #bbf7d0;
    }

    header,
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .version {
      color: #64748b;
      font-size: 12px;
    }

    .repo-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .repo {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 15px;
    }

    .repo-name {
      font-weight: bold;
      font-size: 17px;
      word-break: break-word;
    }

    .repo-description {
      color: #94a3b8;
      font-size: 13px;
      margin: 8px 0 14px;
      min-height: 35px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .file {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background: #020617;
    }

    .file-name {
      font-weight: bold;
      word-break: break-word;
    }

    .file-meta {
      color: #64748b;
      font-size: 11px;
      margin-top: 4px;
    }

    .file-buttons {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .small {
      border: 0;
      border-radius: 7px;
      padding: 7px 9px;
      background: #334155;
      color: white;
      font-size: 12px;
    }

    .small-danger {
      background: #991b1b;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .8);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 9999;
    }

    .modal-box {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 15px;
      padding: 16px;
    }

    .preview {
      max-width: 100%;
      max-height: 70vh;
      display: block;
      margin: auto;
      border-radius: 10px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      max-height: 65vh;
      overflow: auto;
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      .card {
        padding: 14px;
      }

      .repo-grid {
        grid-template-columns: 1fr;
      }

      .file {
        align-items: flex-start;
        flex-direction: column;
      }

      .file-buttons {
        width: 100%;
      }

      .small {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ================= LOGIN ================= -->

  <section id="loginPage">

    <div class="card login">

      <div class="logo">
        🔐 YasamGit
      </div>

      <div class="version">
        Backend V5.2
      </div>

      <br>

      <h1>Admin Login</h1>

      <p>
        Masukkan password administrator
        untuk masuk ke YasamGit.
      </p>

      <form id="loginForm">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

        <button
          id="loginButton"
          class="btn login-button"
          type="submit"
        >
          🔐 Login
        </button>

      </form>

      <div
        id="loginStatus"
        class="status hidden"
      ></div>

    </div>

  </section>


  <!-- ================= APP ================= -->

  <section
    id="appPage"
    class="hidden"
  >

    <header>

      <div>

        <div class="logo">
          📁 YasamGit
        </div>

        <div class="version">
          V5.2
        </div>

      </div>

      <button
        id="logoutButton"
        class="btn danger"
      >
        🚪 Logout
      </button>

    </header>


    <!-- SESSION -->

    <div class="card">

      <div class="topbar">

        <div>

          <h2>
            👤 Admin
          </h2>

          <p id="sessionStatus">
            Session aktif
          </p>

        </div>

        <button
          id="refreshButton"
          class="btn secondary"
        >
          🔄 Refresh
        </button>

      </div>

    </div>


    <!-- REPOSITORIES -->

    <div class="card">

      <div class="topbar">

        <h2>
          📁 Repository
        </h2>

        <button
          id="createRepoButton"
          class="btn success"
        >
          ➕ Buat Repo
        </button>

      </div>

      <br>

      <input
        id="repoSearch"
        type="search"
        placeholder="🔍 Cari repository..."
      >

      <div
        id="repoLoading"
        class="loading hidden"
      >
        ⏳ Memuat repository...
      </div>

      <div
        id="repoList"
        class="repo-grid"
      ></div>

    </div>


    <!-- FILE MANAGER -->

    <div
      id="fileSection"
      class="card hidden"
    >

      <div class="topbar">

        <div>

          <h2>
            📂 File Manager
          </h2>

          <p id="repoTitle"></p>

        </div>

        <button
          id="backRepoButton"
          class="btn secondary"
        >
          ← Kembali
        </button>

      </div>

      <div
        id="pathDisplay"
        style="margin:15px 0;color:#94a3b8"
      >
        /
      </div>

      <div class="actions">

        <button
          id="uploadButton"
          class="btn"
        >
          📤 Upload
        </button>

        <button
          id="folderButton"
          class="btn secondary"
        >
          📁 Folder
        </button>

        <button
          id="refreshFilesButton"
          class="btn secondary"
        >
          🔄 Refresh
        </button>

      </div>

      <input
        id="fileInput"
        type="file"
        multiple
        class="hidden"
      >

      <div
        id="fileLoading"
        class="loading hidden"
      >
        ⏳ Memuat file...
      </div>

      <div
        id="fileList"
        class="file-list"
      ></div>

    </div>

  </section>

</div>


<!-- ================= MODAL ================= -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="topbar">

      <h2 id="modalTitle">
        YasamGit
      </h2>

      <button
        id="closeModalButton"
        class="btn secondary"
      >
        ✕
      </button>

    </div>

    <div
      id="modalContent"
      style="margin-top:15px"
    ></div>

  </div>

</div>


<script>

/* ==========================================
   CONFIG
========================================== */

const API =
  "https://yasam-git-backend.vercel.app";


/* ==========================================
   STATE
========================================== */

let currentRepo = null;
let currentPath = "";
let repositories = [];


/* ==========================================
   ELEMENTS
========================================== */

const loginPage =
  document.getElementById(
    "loginPage"
  );

const appPage =
  document.getElementById(
    "appPage"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const repoList =
  document.getElementById(
    "repoList"
  );

const repoSearch =
  document.getElementById(
    "repoSearch"
  );

const repoLoading =
  document.getElementById(
    "repoLoading"
  );

const fileSection =
  document.getElementById(
    "fileSection"
  );

const fileList =
  document.getElementById(
    "fileList"
  );

const fileLoading =
  document.getElementById(
    "fileLoading"
  );

const fileInput =
  document.getElementById(
    "fileInput"
  );

const modal =
  document.getElementById(
    "modal"
  );

const modalTitle =
  document.getElementById(
    "modalTitle"
  );

const modalContent =
  document.getElementById(
    "modalContent"
  );


/* ==========================================
   API REQUEST
========================================== */

async function request(
  endpoint,
  options = {}
) {

  const response =
    await fetch(
      API + endpoint,
      {
        credentials: "include",

        ...options,

        headers: {
          ...(options.body
            ? {
                "Content-Type":
                  "application/json"
              }
            : {}),

          ...(options.headers || {})
        }
      }
    );

  const text =
    await response.text();

  let data;

  try {

    data =
      text
        ? JSON.parse(text)
        : {};

  } catch {

    data = {
      ok: false,
      error:
        text ||
        "Response backend tidak valid."
    };
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      `HTTP ${response.status}`
    );
  }

  return data;
}


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    hideStatus();

    const password =
      passwordInput.value.trim();

    if (!password) {

      showStatus(
        "Password wajib diisi.",
        false
      );

      return;
    }

    loginButton.disabled =
      true;

    loginButton.textContent =
      "⏳ Login...";

    try {

      const result =
        await request(
          "/api/login",
          {
            method: "POST",

            body:
              JSON.stringify({
                password
              })
          }
        );

      if (!result.ok) {

        throw new Error(
          result.error ||
          "Login gagal."
        );
      }

      passwordInput.value =
        "";

      showStatus(
        "✅ Login berhasil.",
        true
      );

      await checkSession();

    } catch(error) {

      console.error(
        "LOGIN:",
        error
      );

      showStatus(
        error.message ||
        "Failed to fetch",
        false
      );

    } finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        "🔐 Login";
    }
  }
);


/* ==========================================
   SESSION
========================================== */

async function checkSession() {

  try {

    const result =
      await request(
        "/api/session"
      );

    if (
      result.authenticated === true
    ) {

      loginPage
        .classList
        .add("hidden");

      appPage
        .classList
        .remove("hidden");

      document
        .getElementById(
          "sessionStatus"
        )
        .textContent =
        "🟢 Session aktif";

      await loadRepositories();

    } else {

      loginPage
        .classList
        .remove("hidden");

      appPage
        .classList
        .add("hidden");
    }

  } catch(error) {

    console.error(
      "SESSION:",
      error
    );

    showStatus(
      "❌ Tidak bisa terhubung ke backend: " +
      error.message,
      false
    );
  }
}


/* ==========================================
   LOGOUT
========================================== */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async () => {

      try {

        await request(
          "/api/logout",
          {
            method: "POST"
          }
        );

      } catch(error) {

        console.error(
          error
        );
      }

      currentRepo = null;
      currentPath = "";

      fileSection
        .classList
        .add("hidden");

      appPage
        .classList
        .add("hidden");

      loginPage
        .classList
        .remove("hidden");

      passwordInput.value = "";

      hideStatus();
    }
  );


/* ==========================================
   REPOSITORIES
========================================== */

async function loadRepositories() {

  repoLoading
    .classList
    .remove("hidden");

  repoList.innerHTML = "";

  try {

    const result =
      await request(
        "/api/github?type=repos"
      );

    repositories =
      Array.isArray(
        result.repositories
      )
        ? result.repositories
        : [];

    renderRepositories();

  } catch(error) {

    repoList.innerHTML =
      `
      <div class="empty">
        ❌ ${escapeHtml(
          error.message
        )}
      </div>
      `;

  } finally {

    repoLoading
      .classList
      .add("hidden");
  }
}


function renderRepositories() {

  const search =
    repoSearch.value
      .trim()
      .toLowerCase();

  const filtered =
    repositories.filter(
      repo =>
        String(
          repo.name || ""
        )
        .toLowerCase()
        .includes(search)
    );

  if (!filtered.length) {

    repoList.innerHTML =
      `
      <div class="empty">
        📁 Repository tidak ditemukan.
      </div>
      `;

    return;
  }

  repoList.innerHTML =
    filtered
      .map(
        repo => {

          const name =
            String(
              repo.name || ""
            );

          return `
            <div class="repo">

              <div class="repo-name">
                📁 ${escapeHtml(
                  name
                )}
              </div>

              <div class="repo-description">
                ${escapeHtml(
                  repo.description ||
                  "Tidak ada deskripsi."
                )}
              </div>

              <button
                class="btn"
                data-repo="${escapeHtml(
                  name
                )}"
              >
                📂 Buka
              </button>

            </div>
          `;
        }
      )
      .join("");

  repoList
    .querySelectorAll(
      "[data-repo]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            openRepository(
              button.dataset.repo
            );
          }
        );
      }
    );
}


repoSearch.addEventListener(
  "input",
  renderRepositories
);


/* ==========================================
   OPEN REPOSITORY
========================================== */

async function openRepository(
  name
) {

  currentRepo = name;
  currentPath = "";

  document
    .getElementById(
      "repoTitle"
    )
    .textContent =
    name;

  fileSection
    .classList
    .remove("hidden");

  await loadFiles();
}


/* ==========================================
   FILES
========================================== */

async function loadFiles() {

  if (!currentRepo) {
    return;
  }

  fileLoading
    .classList
    .remove("hidden");

  fileList.innerHTML = "";

  document
    .getElementById(
      "pathDisplay"
    )
    .textContent =
    "/" +
    currentPath;

  try {

    const params =
      new URLSearchParams();

    params.set(
      "type",
      "files"
    );

    params.set(
      "repo",
      currentRepo
    );

    params.set(
      "path",
      currentPath
    );

    const result =
      await request(
        "/api/github?" +
        params.toString()
      );

    const files =
      Array.isArray(
        result.files
      )
        ? result.files
        : [];

    renderFiles(files);

  } catch(error) {

    fileList.innerHTML =
      `
      <div class="empty">
        ❌ ${escapeHtml(
          error.message
        )}
      </div>
      `;

  } finally {

    fileLoading
      .classList
      .add("hidden");
  }
}


function renderFiles(
  files
) {

  if (!files.length) {

    fileList.innerHTML =
      `
      <div class="empty">
        📂 Folder kosong.
      </div>
      `;

    return;
  }

  fileList.innerHTML =
    files
      .map(
        file => {

          const isFolder =
            file.type === "dir";

          return `
            <div class="file">

              <div
                style="flex:1;min-width:0"
              >

                <div
                  class="file-name"
                  data-open="${escapeHtml(
                    file.path
                  )}"
                  data-type="${isFolder
                    ? "folder"
                    : "file"}"
                >
                  ${
                    isFolder
                      ? "📁"
                      : fileIcon(
                          file.name
                        )
                  }
                  ${escapeHtml(
                    file.name
                  )}
                </div>

                <div class="file-meta">
                  ${
                    isFolder
                      ? "Folder"
                      : formatBytes(
                          file.size || 0
                        )
                  }
                </div>

              </div>

              <div class="file-buttons">

                ${
                  !isFolder
                    ? `
                      <button
                        class="small"
                        data-action="preview"
                        data-path="${escapeHtml(
                          file.path
                        )}"
                      >
                        👁️
                      </button>

                      <button
                        class="small"
                        data-action="download"
                        data-path="${escapeHtml(
                          file.path
                        )}"
                      >
                        ⬇️
                      </button>

                      <button
                        class="small"
                        data-action="edit"
                        data-path="${escapeHtml(
                          file.path
                        )}"
                      >
                        ✏️
                      </button>
                    `
                    : ""
                }

                <button
                  class="small"
                  data-action="rename"
                  data-path="${escapeHtml(
                    file.path
                  )}"
                  data-name="${escapeHtml(
                    file.name
                  )}"
                >
                  ✏️
                </button>

                <button
                  class="small small-danger"
                  data-action="delete"
                  data-path="${escapeHtml(
                    file.path
                  )}"
                >
                  🗑️
                </button>

              </div>

            </div>
          `;
        }
      )
      .join("");

  attachFileEvents();
}


function attachFileEvents() {

  fileList
    .querySelectorAll(
      "[data-open]"
    )
    .forEach(
      element => {

        element.addEventListener(
          "click",
          () => {

            const path =
              element.dataset.open;

            if (
              element.dataset.type ===
              "folder"
            ) {

              currentPath =
                path;

              loadFiles();

            } else {

              previewFile(
                path
              );
            }
          }
        );
      }
    );

  fileList
    .querySelectorAll(
      "[data-action]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            const action =
              button.dataset.action;

            const path =
              button.dataset.path;

            if (
              action ===
              "preview"
            ) {
              previewFile(path);
            }

            if (
              action ===
              "download"
            ) {
              downloadFile(path);
            }

            if (
              action ===
              "edit"
            ) {
              editFile(path);
            }

            if (
              action ===
              "rename"
            ) {
              renameFile(
                path,
                button.dataset.name
              );
            }

            if (
              action ===
              "delete"
            ) {
              deleteFile(path);
            }
          }
        );
      }
    );
}


/* ==========================================
   UPLOAD
========================================== */

document
  .getElementById(
    "uploadButton"
  )
  .addEventListener(
    "click",
    () => {

      fileInput.click();
    }
  );


fileInput.addEventListener(
  "change",
  async () => {

    const files =
      Array.from(
        fileInput.files
      );

    if (!files.length) {
      return;
    }

    for (
      const file of files
    ) {

      try {

        await uploadFile(
          file
        );

      } catch(error) {

        alert(
          `Upload ${file.name} gagal:\n` +
          error.message
        );
      }
    }

    fileInput.value = "";

    await loadFiles();
  }
);


async function uploadFile(
  file
) {

  const buffer =
    await file.arrayBuffer();

  const bytes =
    new Uint8Array(buffer);

  let binary = "";

  const chunk =
    0x8000;

  for (
    let i = 0;
    i < bytes.length;
    i += chunk
  ) {

    binary +=
      String.fromCharCode(
        ...bytes.subarray(
          i,
          i + chunk
        )
      );
  }

  const base64 =
    btoa(binary);

  const path =
    currentPath
      ? currentPath +
        "/" +
        file.name
      : file.name;

  return request(
    "/api/file",
    {
      method: "POST",

      body:
        JSON.stringify({
          action: "upload",
          repo: currentRepo,
          path,
          content: base64,
          encoding: "base64",
          message:
            `Upload ${file.name}`
        })
    }
  );
}


/* ==========================================
   CREATE FOLDER
========================================== */

document
  .getElementById(
    "folderButton"
  )
  .addEventListener(
    "click",
    async () => {

      const name =
        prompt(
          "Nama folder:"
        );

      if (!name) {
        return;
      }

      const path =
        currentPath
          ? currentPath +
            "/" +
            name +
            "/.gitkeep"
          : name +
            "/.gitkeep";

      try {

        await request(
          "/api/file",
          {
            method: "POST",

            body:
              JSON.stringify({
                action:
                  "upload",

                repo:
                  currentRepo,

                path,

                content: "",

                encoding:
                  "utf8",

                message:
                  `Create folder ${name}`
              })
          }
        );

        await loadFiles();

      } catch(error) {

        alert(
          error.message
        );
      }
    }
  );


/* ==========================================
   RENAME
========================================== */

async function renameFile(
  oldPath,
  oldName
) {

  const newName =
    prompt(
      "Nama baru:",
      oldName
    );

  if (
    !newName ||
    newName === oldName
  ) {
    return;
  }

  const parts =
    oldPath.split("/");

  parts.pop();

  const parent =
    parts.join("/");

  const newPath =
    parent
      ? parent +
        "/" +
        newName
      : newName;

  try {

    await request(
      "/api/file",
      {
        method: "POST",

        body:
          JSON.stringify({
            action:
              "rename",

            repo:
              currentRepo,

            oldPath,

            newPath,

            message:
              `Rename ${oldName}`
          })
      }
    );

    await loadFiles();

  } catch(error) {

    alert(
      error.message
    );
  }
}

/* ==========================================
   PREVIEW
========================================== */

async function previewFile(
  path
) {

  openModal(
    "👁️ Preview",
    `<div class="loading">
      ⏳ Loading...
    </div>`
  );

  try {

    const result =
      await request(
        "/api/file?" +
        new URLSearchParams({
          action: "read",
          repo: currentRepo,
          path
        }).toString()
      );

    if (
      result.dataUrl
    ) {

      if (
        isVideo(path)
      ) {

        modalContent.innerHTML =
          `
          <video
            class="preview"
            controls
            src="${result.dataUrl}"
          ></video>
          `;

      } else {

        modalContent.innerHTML =
          `
          <img
            class="preview"
            src="${result.dataUrl}"
            alt=""
          >
          `;
      }

      return;
    }

    modalContent.innerHTML =
      `
      <pre>${escapeHtml(
        result.content || ""
      )}</pre>
      `;

  } catch(error) {

    modalContent.innerHTML =
      `
      <div class="status error">
        ❌ ${escapeHtml(
          error.message
        )}
      </div>
      `;
  }
}

/* ==========================================
   DOWNLOAD
========================================== */

async function downloadFile(
  path
) {

  try {

    const result =
      await request(
        "/api/file?" +
        new URLSearchParams({
          action: "read",
          repo: currentRepo,
          path
        }).toString()
      );

    if (
      result.dataUrl
    ) {

      const link =
        document.createElement(
          "a"
        );

      link.href =
        result.dataUrl;

      link.download =
        path.split("/").pop();

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      return;
    }

    const blob =
      new Blob(
        [
          result.content ||
          ""
        ],
        {
          type:
            "application/octet-stream"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        "a"
      );

    link.href = url;

    link.download =
      path.split("/").pop();

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
      url
    );

  } catch(error) {

    alert(
      error.message
    );
  }
}

/* ==========================================
   HELPERS
========================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function formatBytes(
  bytes
) {

  if (!bytes) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  let index = 0;
  let value = Number(bytes);

  while (
    value >= 1024 &&
    index <
      units.length - 1
  ) {

    value /= 1024;
    index++;
  }

  return (
    value.toFixed(
      index === 0
        ? 0
        : 1
    ) +
    " " +
    units[index]
  );
}


function fileIcon(
  name
) {

  const ext =
    name
      .split(".")
      .pop()
      .toLowerCase();

  if (
    [
      "jpg",
      "jpeg",
      "png",
      "gif",
      "webp",
      "svg"
    ].includes(ext)
  ) {
    return "🖼️";
  }

  if (
    [
      "mp4",
      "webm",
      "mov",
      "avi",
      "mkv"
    ].includes(ext)
  ) {
    return "🎬";
  }

  if (
    [
      "js",
      "ts",
      "jsx",
      "tsx",
      "html",
      "css",
      "json",
      "py",
      "php",
      "java"
    ].includes(ext)
  ) {
    return "💻";
  }

  if (
    [
      "zip",
      "rar",
      "7z",
      "tar",
      "gz"
    ].includes(ext)
  ) {
    return "📦";
  }

  return "📄";
}


function isVideo(
  path
) {

  const ext =
    path
      .split(".")
      .pop()
      .toLowerCase();

  return [
    "mp4",
    "webm",
    "mov",
    "ogg",
    "avi"
  ].includes(ext);
}
